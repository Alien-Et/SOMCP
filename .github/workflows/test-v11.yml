name: Test v11

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # 见 test.yml：自动合并（GITHUB_TOKEN）不会触发 push 事件，由
  # pr-auto-review.yml 在合并后 dispatch 补触发；PR 阶段由
  # pull_request 覆盖，本入口只服务 main。
  workflow_dispatch:
# ---------------------------------------------------------------------------
# Toolchain versions live here and nowhere else in this file.
#
# The three build workflows (build.yml / release.yml / test-v11.yml) must agree
# on every one of these: a checks run that compiles with a different NDK, cmake
# or Gradle than the release does cannot prove the release is buildable. Keep
# the block byte-identical across the three files; `docs/17.构建与CI.md` records
# the canonical values and why each is pinned.
# ---------------------------------------------------------------------------
env:
  # JDK for AGP/Gradle. 17 is what AGP 8.x requires; do not drift to 21.
  SOMCP_JAVA_VERSION: "17"
  # Must match gradle/wrapper/gradle-wrapper.properties (the repo ships the
  # properties file but no gradlew launcher, so the version is provisioned by
  # the action and has to be stated here too).
  SOMCP_GRADLE_VERSION: "9.6.1"
  # Android SDK levels. The NDK string is the exact sdkmanager package name and
  # is also hard-pinned by tools/blutter-matrix/matrix-config.json.
  SOMCP_ANDROID_PLATFORM: "platforms;android-36"
  SOMCP_BUILD_TOOLS: "build-tools;36.0.0"
  SOMCP_NDK: "ndk;29.0.14206865"
  # cmake;3.22.1 is NOT optional: the runner image ships CMake 4.x, which turns
  # `cmake_minimum_required(VERSION <3.5)` and `cmake_policy(SET CMPxxxx OLD)`
  # into hard errors, and the pinned third_party trees still declare both.
  SOMCP_CMAKE: "cmake;3.22.1"
  # Gradle 发行包的字节来源。services.gradle.org 会 307 跳到 GitHub release
  # 资产 CDN,而那个 CDN 会整段 504(实测 run 42469477147);镜像上的字节与
  # 官方哈希一致,完整性由下面的 sha256 保证,所以镜像只是更快、更少抖动的
  # 来源,不是信任上的放宽。downloader 里仍保留官方地址作最后兜底。
  SOMCP_GRADLE_DIST_MIRROR: "https://mirrors.cloud.tencent.com/gradle"
  # 官方 gradle-9.6.1-bin.zip 的 sha256,取自
  # https://services.gradle.org/distributions/gradle-9.6.1-bin.zip.sha256。
  # 换 Gradle 版本时这一行必须跟着换,否则 seed 会在校验处直接失败。
  SOMCP_GRADLE_DIST_SHA256: "9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # A full cold run is ~65 min (measured on release.yml: Rizin+LIEF 36 min,
    # rz-ghidra 15 min, Unidbg 5 min, builds 8 min) plus lint/unit-test work
    # that release.yml does not do. The default 360 min is far too generous for
    # a pull-request gate and a wedged native build would hold a runner for six
    # hours; 150 min leaves ~2x headroom over the measured cold path.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          # Submodules are initialised by tools/init-submodules.sh, not by
          # actions/checkout: a nested rizinorg/ghidra pin can be a commit upstream has
          # cleaned away, and `recursive` then dies at checkout with only
          # `upload-pack: not our ref`. See the note at the top of .gitmodules.
          submodules: false
          fetch-depth: 0
      - name: Init submodules
        # 非递归 checkout 之后补上 third_party/*；嵌套的 rizinorg/ghidra pin 可能是
        # 已被上游清洗的死提交，按分支名取 + 本地校验能把这类失败落在有名字的检核点上
        # （取不到时才回落按 SHA 抓）。细节见脚本头部注释。
        run: bash tools/init-submodules.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.SOMCP_JAVA_VERSION }}
      # The repo ships gradle/wrapper/gradle-wrapper.properties but no gradlew
      # launcher, so the distribution is provisioned by an action -- and that
      # action downloads from services.gradle.org, which 307-redirects to the
      # GitHub release asset CDN. That CDN can answer 504 for a whole outage
      # window, and setup-gradle gives up after two retries (~35s), failing the
      # job before any step of ours runs (run 42469477147 died there). So place
      # the distribution ourselves first: tools/seed-gradle.sh fetches it from
      # SOMCP_GRADLE_DIST_MIRROR, verifies it against the pinned official
      # SOMCP_GRADLE_DIST_SHA256, and unpacks it into setup-gradle's own
      # installation directory; the action then finds that version on PATH and
      # reports "already available on PATH. Not installing." -- no network.
      - name: Seed Gradle distribution from mirror (sha256-verified)
        run: bash tools/seed-gradle.sh "$SOMCP_GRADLE_VERSION" "$SOMCP_GRADLE_DIST_MIRROR" "$SOMCP_GRADLE_DIST_SHA256"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.SOMCP_GRADLE_VERSION }}
          cache-disabled: true
      - uses: android-actions/setup-android@v3
        with:
          # The action's default packages are "tools platform-tools". Google has
          # removed the legacy `tools` package from the SDK repository, so keep
          # platform-tools only.
          packages: platform-tools
      # cmake;3.22.1 is not optional: the runner image ships CMake 4.x, and
      # the pinned legacy native trees (capstone 4.0.2, keystone with its
      # bundled LLVM) still call cmake_policy(SET CMP0051 OLD), which 4.x
      # rejects outright ("Policy CMP0051 may not be set to OLD behavior").
      # build.yml and release.yml always installed this; test-v11 did not,
      # so its Unidbg step fell back to the system cmake and died. The
      # scripts also normalise those CMakeLists themselves now, so this is
      # the first line of defence rather than the only one.
      - run: sdkmanager "$SOMCP_ANDROID_PLATFORM" "$SOMCP_BUILD_TOOLS" "$SOMCP_NDK" "$SOMCP_CMAKE"

      - name: Determine base revision
        id: base-rev
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for empty PR
        run: |
          BASE="${{ steps.base-rev.outputs.base }}"
          changed_files=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || echo "")
          if [ -z "$changed_files" ]; then
            echo "::error::This PR contains no meaningful changes compared to the base branch."
            exit 1
          fi
          echo "Changed files:"
          echo "$changed_files"
      - name: Workflow toolchain version consistency
        # A checks run that compiles with a different JDK/Gradle/NDK/cmake than
        # the release does cannot prove the release is buildable — that is how
        # test-v11 stayed green while the release APK was the only one carrying
        # Unidbg and rz-ghidra natives. Each workflow declares its versions once
        # in a top-level env block; this step fails on a hard-coded copy or on
        # two workflows disagreeing.
        run: python3 tools/check-workflow-versions.py
      - name: Profanity check
        run: |
          BASE="${{ steps.base-rev.outputs.base }}"
          PATTERNS="\bfuck\b|\bshit\b|\bbitch\b|\bass\b|\bdamn\b|\bcrap\b|\bdick\b|\bbastard\b|\bslut\b|\bwhore\b|\bpiss\b|\bcock\b|\bcunt\b|\basshole\b|\bmotherfucker\b|\bfucker\b|\bfucking\b|\bsonofabitch\b|\b混蛋\b|\b傻逼\b|\b操你妈\b|\b草泥马\b|\b他妈\b|\b尼玛\b|\b艹\b|\bfuckyou\b|\bfk\b"
          violations=$(git diff "$BASE"...HEAD --diff-filter=AM \
            | grep -n -i -E "$PATTERNS" \
            | sed 's/^/  /' || true)
          if [ -n "$violations" ]; then
            echo "::error::Profanity detected in the following diff lines:"
            echo "$violations"
            exit 1
          fi
          echo "Profanity check passed."
      - name: AGPL-3.0-only license compliance check
        run: |
          BASE="${{ steps.base-rev.outputs.base }}"
          exit_code=0
          if git diff "$BASE"...HEAD --name-only --diff-filter=D | grep -q "^LICENSE$"; then
            echo "::error::The LICENSE file must not be deleted. This project is AGPL-3.0-only."
            exit_code=1
          fi
          if git diff "$BASE"...HEAD --name-only --diff-filter=M | grep -q "^LICENSE$"; then
            if ! head -n 1 LICENSE | grep -qi "GNU AFFERO GENERAL PUBLIC LICENSE"; then
              echo "::error::The LICENSE file must remain licensed under AGPL-3.0-only."
              exit_code=1
            fi
          fi
          NEW_SOURCE_FILES=$(git diff "$BASE"...HEAD --name-only --diff-filter=A \
            | grep -E '\.(kt|java|cpp|c|h|hpp|py|rs|go|sh|gradle|groovy)$' || true)
          if [ -n "$NEW_SOURCE_FILES" ]; then
            while IFS= read -r file; do
              if ! head -n 30 "$file" | grep -qi "GNU.*Affero.*General.*Public.*License\|AGPL[- ]3\.0\|AGPL-3\.0-only"; then
                echo "::error::New source file '$file' is missing a AGPL-3.0 license header. All new files must be licensed under AGPL-3.0-only."
                exit_code=1
              fi
            done <<< "$NEW_SOURCE_FILES"
          fi
          if [ $exit_code -eq 0 ]; then
            echo "AGPL-3.0-only compliance check passed."
          fi
          exit $exit_code
      - name: PR size check
        run: |
          BASE="${{ steps.base-rev.outputs.base }}"
          total_files=$(git diff --name-only "$BASE"...HEAD | wc -l)
          total_additions=$(git diff "$BASE"...HEAD --diff-filter=AM --numstat | awk '{s+=$1} END {print s}')
          echo "PR stats: $total_files files changed, ~${total_additions:-0} additions"
          if [ "$total_files" -gt 50 ]; then
            echo "::warning::Large PR: $total_files files changed. Consider splitting into smaller, focused PRs."
          fi
          if [ "${total_additions:-0}" -gt 2000 ]; then
            echo "::warning::Large PR: ~$total_additions lines added. Consider splitting into smaller, focused PRs."
          fi
      - name: ktlint — Kotlin code style check
        run: |
          cd /tmp
          curl -sSLO -L "https://github.com/ktlint/ktlint/releases/download/1.5.0/ktlint"
          chmod +x ktlint
          cd -
          violations=$(/tmp/ktlint --relative "app/src/**/*.kt" 2>&1) || true
          if [ -n "$violations" ]; then
            echo "::error::Kotlin code style violations found:"
            echo "$violations"
            exit 1
          fi
          echo "ktlint check passed."
      - name: Lint check
        run: gradle :app:lintDebug --stacktrace
      - name: Install native build tools
        run: bash tools/ci/install-build-tools.sh
      - name: Clone Rizin source (latest release)
        timeout-minutes: 15
        run: bash tools/ci/clone-rizin.sh
      - name: Cache native backends (Rizin + LIEF)
        uses: actions/cache@v4
        with:
          path: |
            rizin-build
            third_party/lief-build
          # Key derived from the build script, cross templates and CMakeLists:
          # any change to how the archives are produced invalidates the cache.
          key: native-linux-${{ hashFiles('build-native-android.sh', 'rizin-cross-*.ini', 'rizin-native.ini', 'app/src/main/cpp/CMakeLists.txt') }}-ndk29-rizin091
      - name: Build native backends (Rizin + LIEF)
        run: bash build-native-android.sh

      # Cross-compiling capstone + keystone + unicorn for four ABIs is slow and
      # depends only on the three submodule pins and this script, never on our
      # sources. Cache the produced .so files per ABI; the build step below
      # skips any ABI whose outputs are already complete, so a cache hit is a
      # real skip (the script itself always rebuilds, so caching its build
      # trees would buy nothing).
      - name: Cache Unidbg native libs
        id: cache-unidbg
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libcapstone.so
            app/src/main/jniLibs/arm64-v8a/libkeystone.so
            app/src/main/jniLibs/arm64-v8a/libunicorn.so
            app/src/main/jniLibs/x86_64/libcapstone.so
            app/src/main/jniLibs/x86_64/libkeystone.so
            app/src/main/jniLibs/x86_64/libunicorn.so
            app/src/main/jniLibs/armeabi-v7a/libcapstone.so
            app/src/main/jniLibs/armeabi-v7a/libkeystone.so
            app/src/main/jniLibs/x86/libcapstone.so
            app/src/main/jniLibs/x86/libkeystone.so
          key: unidbg-native-${{ hashFiles('build-unidbg-native.sh', '.gitmodules') }}-ndk29-v1
      # The Unidbg natives are NOT in the unidbg Maven artifacts for Android
      # (those jars only carry linux_64 / linux_aarch64), so without this step
      # the APK ships with only libcapstone.so and every emulate_* / unidbg_*
      # call dies with `dlopen failed: library "libkeystone.so" not found`.
      # release.yml has always had this step; the checks job did not, so the
      # artifacts it produced were not the artifacts a release would ship.
      - name: Build Unidbg native libs (capstone/keystone/unicorn)
        run: bash tools/ci/build-unidbg-natives.sh --skip-existing
      # libcore_ghidra.so is loaded from the APK's jniLibs lib dir, so it has
      # to be packaged like any other native. Missing it is not a build
      # failure at runtime -- read_disasm just returns no pseudocode -- which
      # is exactly why the checks job has to assert it is there.
      #
      # This script also installs a Rizin SDK per ABI (find_package(Rizin)
      # needs it), which is another long meson/ninja run, so cache the four
      # plugin outputs and skip the ABI when they are all there.
      - name: Cache rz-ghidra plugin
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libcore_ghidra.so
            app/src/main/jniLibs/armeabi-v7a/libcore_ghidra.so
            app/src/main/jniLibs/x86/libcore_ghidra.so
            app/src/main/jniLibs/x86_64/libcore_ghidra.so
            rizin-sdk
            third_party/rz-ghidra-install-arm64-v8a
            third_party/rz-ghidra-install-armeabi-v7a
            third_party/rz-ghidra-install-x86
            third_party/rz-ghidra-install-x86_64
          key: rz-ghidra-${{ hashFiles('build-rz-ghidra-android.sh', '.gitmodules') }}-ndk29-v1
      - name: Build rz-ghidra plugin (libcore_ghidra.so)
        run: bash tools/ci/build-rz-ghidra.sh --skip-existing
      - name: Verify rz-ghidra plugin in jniLibs
        run: bash tools/ci/verify-rz-ghidra.sh

      - name: Build Blutter runners (best-effort)
        continue-on-error: true
        run: |
          set -euo pipefail
          # Validate that the curated Dart AOT blutter runner matrix
          # (tools/blutter-matrix/curated-versions.json, e.g. Dart 3.11.5 /
          # Flutter 3.41.x) cross-compiles on the NDK available in CI, and on
          # success install the regenerated runners.json + libblutter_*.so so
          # the debug/release APKs below also carry them (issue #5).
          #
          # Best-effort on purpose: this is a multi-hour Dart VM cross-compile.
          # build-blutter-runners.sh only touches app/src/main after staging
          # passes verify_manifest.py, so a failure here never breaks CI or the
          # committed runners/manifest.
          bash tools/blutter-matrix/build-blutter-runners.sh
      - name: Debug build
        run: gradle :app:assembleDebug --stacktrace
      - name: Restore release signing keystore (or CI fallback)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KS_ALIAS: ${{ secrets.ALIAS }}
          KS_ALIAS_PASS: ${{ secrets.ALIAS_PASSWORD }}
          KS_STORE_PASS: ${{ secrets.PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KS_ALIAS" ] \
             && [ -n "$KS_ALIAS_PASS" ] && [ -n "$KS_STORE_PASS" ]; then
            # Real release keystore from repository secrets (BASE64-encoded).
            # Shared with build.yml / release.yml so all three go through the
            # same tr -d '[:space:]' + keytool verification path.
            bash tools/ci/restore-keystore.sh --write-properties
          else
            # Fallback (e.g. fork PRs cannot access repository secrets):
            # CI-only throwaway keystore, fresh key each run, NOT for
            # distribution. APKs signed with it cannot be installed over the
            # real release (docs/forum-post.md); build verification only.
            bash tools/ci/make-ci-keystore.sh --write-properties
          fi
      - name: Release build
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify and ensure v2/v3 APK signing
        run: bash tools/ci/verify-apk-signing.sh --properties release/keystore.properties
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
