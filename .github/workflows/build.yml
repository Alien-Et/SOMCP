name: Build & Sign APK

on:
  workflow_dispatch:

# Pushes to main are serialized; a newer push supersedes an in-flight build so
# the artifact always corresponds to the branch tip, not a stale queue entry.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Safety net for the whole chain: the validated pipeline takes ~56 min
    # (run 34614015172); 150 min leaves ~2.5x headroom while guaranteeing a
    # wedged network step can never occupy the runner for the 360-min default.
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # build-native-android.sh / build-unidbg-native.sh compile from the
          # in-repo third_party/* submodules (rizin, LIEF, capstone, keystone,
          # unicorn 2.x, unidbg's JNI bridge); without them the native backends
          # cannot be produced and the emulated engine degrades or fails.
          # Submodules are initialised by tools/init-submodules.sh, not by
          # actions/checkout: a nested rizinorg/ghidra pin can be a commit upstream has
          # cleaned away, and `recursive` then dies at checkout with only
          # `upload-pack: not our ref`. See the note at the top of .gitmodules.
          submodules: false
      - name: Init submodules
        # 非递归 checkout 之后补上 third_party/*；嵌套的 rizinorg/ghidra pin 可能是
        # 已被上游清洗的死提交，按分支名取 + 本地校验能把这类失败落在有名字的检核点上
        # （取不到时才回落按 SHA 抓）。细节见脚本头部注释。
        run: bash tools/init-submodules.sh
      - name: Set up JDK 17
        # v6 runs on the Node 24 runtime and clears the `punycode` (DEP0040)
        # deprecation warning that v4 emitted on the Node 24 runner.
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # The repo ships gradle/wrapper/gradle-wrapper.properties (Gradle 9.6.1)
      # but deliberately no gradlew launcher/gradle-wrapper.jar, so `./gradlew`
      # does not exist. Provision the same Gradle version via the tool instead
      # of chmod-ing a file that is not there (this was the failure in
      # https://github.com/bilieebiliee1-design/SOMCP/actions/runs/34595668784).
      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default packages are "tools platform-tools". Google has
          # removed the legacy `tools` package from the SDK repository, so keep
          # platform-tools only.
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build gcc g++ pkg-config cmake

      # Full-clone of rizinorg/rizin over the public internet. Known network
      # constraint: GitHub-hosted runners reach github.com directly (validated
      # by run 34614015172), but a self-hosted runner without proxy/mirror
      # access can hang here. The step-level timeout + retry loop fail fast
      # with a clear ::error instead of stalling to the job default.
      # 版本不 pin：自动获取 rizin 最新 release tag。rizin master 是移动靶，
      # 2026-09-15 #6736 已破坏 rz-ghidra（RzCons* 参数变更）；rz-ghidra 只
      # 跟踪 rizin release，所以这里永远取最新 release tag。
      - name: Clone Rizin source (latest release)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          LATEST_TAG=$(git ls-remote --tags --sort=-v:refname https://github.com/rizinorg/rizin.git 2>/dev/null | grep -oE 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's|refs/tags/||')
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::无法获取 rizin 最新 release tag（git ls-remote 失败）"
            exit 1
          fi
          echo "::notice::Rizin 最新版本: $LATEST_TAG"
          if [ ! -d third_party/rizin-src/librz/include ]; then
            for attempt in 1 2 3; do
              if git clone --depth 1 --branch "$LATEST_TAG" https://github.com/rizinorg/rizin.git third_party/rizin-src; then
                break
              fi
              rm -rf third_party/rizin-src
              if [ "$attempt" -ge 3 ]; then
                echo "::error::git clone rizin failed after 3 attempts (network unreachable from this runner; configure a proxy/mirror or pre-populate third_party/rizin-src)"
                exit 1
              fi
              echo "rizin clone attempt $attempt failed; retrying in 15s"
              sleep 15
            done
          fi

      # Same pipeline as the Release workflow: librz_native.so / libLIEF are
      # linked from these archives by app/src/main/cpp/CMakeLists.txt, so an
      # APK without this step would build but ship a crippled native engine.
      - name: Build native backends (Rizin + LIEF)
        run: bash build-native-android.sh

      # Cross-compile the Android natives required by the Unidbg backend
      # (libcapstone.so / libkeystone.so / libunicorn.so). Fatal on failure so
      # a "signed APK" artifact can never silently lack the emulation backend.
      - name: Build Unidbg native libs (capstone/keystone/unicorn)
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            bash build-unidbg-native.sh --abi "$abi"
          done
          # unicorn (QEMU, __uint128_t) only compiles for the 64-bit ABIs; the
          # 32-bit ABIs get capstone/keystone only and Unidbg degrades there.
          for abi in arm64-v8a x86_64; do
            for lib in capstone keystone unicorn; do
              test -f "app/src/main/jniLibs/$abi/lib$lib.so" || {
                echo "::error::missing app/src/main/jniLibs/$abi/lib$lib.so after build-unidbg-native.sh"
                exit 1
              }
            done
          done
          for abi in armeabi-v7a x86; do
            for lib in capstone keystone; do
              test -f "app/src/main/jniLibs/$abi/lib$lib.so" || {
                echo "::error::missing app/src/main/jniLibs/$abi/lib$lib.so after build-unidbg-native.sh"
                exit 1
              }
            done
          done
          echo "Unidbg native libs present for required ABIs."

      # Build the rz-ghidra Ghidra decompiler plugin (libcore_ghidra.so) and copy
      # it into jniLibs for all four ABIs. Fatal on failure so a signed APK can
      # never silently lack the Ghidra backend (the app logs "ghidra plugin
      # missing" and degrades to no pseudocode otherwise — see 25_09-18-04-09_117.log).
      - name: Build rz-ghidra plugin (libcore_ghidra.so)
        run: bash build-rz-ghidra-android.sh

      - name: Verify rz-ghidra plugin in jniLibs
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -f "app/src/main/jniLibs/$abi/libcore_ghidra.so" || {
              echo "::error::missing app/src/main/jniLibs/$abi/libcore_ghidra.so after build-rz-ghidra-android.sh"
              exit 1
            }
          done
          echo "libcore_ghidra.so present for all four ABIs."

      # Signing secrets use the same names as the Release workflow
      # (KEYSTORE/ALIAS/ALIAS_PASSWORD/PASSWORD). The old STORE_FILE/... names
      # do not exist as repository secrets, so the previous configuration could
      # never have produced a signed APK even past the gradlew failure.
      - name: Restore release signing keystore
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.KEYSTORE }}" ] \
             || [ -z "${{ secrets.ALIAS }}" ] \
             || [ -z "${{ secrets.ALIAS_PASSWORD }}" ] \
             || [ -z "${{ secrets.PASSWORD }}" ]; then
            echo "::error::Signing secrets (KEYSTORE/ALIAS/ALIAS_PASSWORD/PASSWORD) must all be configured."
            exit 1
          fi
          mkdir -p release
          echo "${{ secrets.KEYSTORE }}" | base64 -d > release/so-reverse-mcp-release.jks
          echo "Restored release signing keystore from secrets."

      - name: Build release APKs
        env:
          # Read by app/build.gradle.kts so no plaintext keystore.properties is
          # ever written to disk.
          STORE_FILE: release/so-reverse-mcp-release.jks
          STORE_PASSWORD: ${{ secrets.PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
          # Reporting API key (log-report-platform X-API-Key). Consumed by
          # app/src/main/cpp/CMakeLists.txt -> generate_header.py, which encrypts (SHA-256-CTR)
          # it into the native header baked into librz_native.so. GitHub masks
          # secrets in logs automatically; it is never echoed here.
          LRP_API_KEY: ${{ secrets.LRP_API_KEY }}
          # XOR key for the signer-pin arrays in key_generated.h
          # (generate_header.py --key). Absent -> per-build random fallback key.
          TM: ${{ secrets.TM }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace

      - name: Verify and ensure v2/v3 APK signing
        env:
          STORE_FILE: release/so-reverse-mcp-release.jks
          STORE_PASSWORD: ${{ secrets.PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "=== Checking signing schemes: $(basename "$apk") ==="
            if "$APKSIGNER" verify --verbose "$apk" 2>&1 | grep -qi "NOT PRESENT"; then
              echo "::warning::v2/v3 signing NOT verified in $(basename "$apk"); re-signing with apksigner"
              "$APKSIGNER" sign \
                --ks "$STORE_FILE" \
                --ks-pass "pass:$STORE_PASSWORD" \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass "pass:$KEY_PASSWORD" \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                --v4-signing-enabled true \
                "$apk"
            fi
            "$APKSIGNER" verify --print-certs "$apk"
            echo "OK: $(basename "$apk") has valid v2/v3 signing"
          done

      # Never let the keystore leak into the uploaded artifact.
      - name: Wipe signing artifacts
        run: rm -f release/so-reverse-mcp-release.jks

      - name: Upload APK
        # Pinned to v7+ (Node 24 rebuild): v4 emitted `[DEP0169] url.parse()`
        # and `punycode` deprecation warnings on the Node 24 runner. Do not
        # downgrade below v7 or the warnings return.
        uses: actions/upload-artifact@v7
        with:
          name: somcp-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
